<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TechUsados - Catálogo Profissional</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    [data-theme="dark"] {
      --bg-primary: #0a0e27;
      --bg-secondary: #111735;
      --bg-card: #151b3a;
      --accent-primary: #00ff88;
      --accent-secondary: #ff006e;
      --text-primary: #ffffff;
      --text-secondary: #b8c5d6;
      --text-muted: #6b7a96;
      --border: #242d4d;
      --shadow: rgba(0, 0, 0, 0.35);
      --grid-opacity: 0.035;
    }

    [data-theme="light"] {
      --bg-primary: #f8f9fb;
      --bg-secondary: #ffffff;
      --bg-card: #ffffff;
      --accent-primary: #00cc6f;
      --accent-secondary: #e91e63;
      --text-primary: #141824;
      --text-secondary: #4a5568;
      --text-muted: #7b8794;
      --border: #e2e8f0;
      --shadow: rgba(0, 0, 0, 0.08);
      --grid-opacity: 0.02;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Space Mono', monospace;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      overflow-x: hidden;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .background-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(90deg, rgba(0,255,136,var(--grid-opacity)) 1px, transparent 1px),
        linear-gradient(rgba(0,255,136,var(--grid-opacity)) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 0 20px;
      position: relative;
      z-index: 1;
    }

    header {
      padding: 40px 0 30px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 35px;
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 30px;
      font-weight: 800;
      color: var(--accent-primary);
      text-transform: uppercase;
      letter-spacing: -1px;
      position: relative;
    }

    .logo::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
      border-radius: 2px;
    }

    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .theme-toggle,
    .ghost-btn {
      padding: 10px 16px;
      background: var(--bg-secondary);
      border: 2px solid var(--border);
      border-radius: 10px;
      color: var(--text-primary);
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme-toggle:hover,
    .ghost-btn:hover {
      border-color: var(--accent-primary);
      transform: translateY(-1px);
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--accent-primary);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .controls {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    .search-box {
      flex: 1;
      min-width: 260px;
    }

    .search-box input {
      width: 100%;
      padding: 14px 18px;
      background: var(--bg-secondary);
      border: 2px solid var(--border);
      border-radius: 10px;
      color: var(--text-primary);
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      transition: all 0.25s;
    }

    .search-box input:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(0,255,136,0.1);
    }

    .filter-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 12px 20px;
      background: var(--bg-secondary);
      border: 2px solid var(--border);
      border-radius: 10px;
      color: var(--text-secondary);
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .filter-btn.active {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
      color: var(--bg-primary);
    }

    .filter-btn:hover {
      border-color: var(--accent-primary);
      color: var(--text-primary);
      transform: translateY(-2px);
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 26px;
      margin-bottom: 60px;
    }

    .product-card {
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      transition: all 0.3s ease;
      position: relative;
      animation: slideUp 0.4s ease-out backwards;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .product-card:hover {
      transform: translateY(-6px);
      border-color: var(--accent-primary);
      box-shadow: 0 20px 40px var(--shadow);
    }

    .product-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      padding: 6px 12px;
      background: var(--accent-secondary);
      color: white;
      font-size: 10px;
      font-weight: 700;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      z-index: 2;
    }

    .product-image {
      width: 100%;
      height: 210px;
      background: var(--bg-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 2px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.35s ease;
    }

    .product-card:hover .product-image img {
      transform: scale(1.08);
    }

    .product-image .emoji-fallback {
      font-size: 72px;
      position: relative;
      z-index: 1;
    }

    .product-image::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(0,255,136,0.05), rgba(255,0,110,0.05));
      z-index: 0;
    }

    .product-content { padding: 22px; }

    .product-category {
      font-size: 10px;
      color: var(--accent-primary);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .product-name {
      font-family: 'Syne', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .product-description {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 16px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-specs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }

    .spec-tag {
      padding: 4px 10px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .product-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }

    .product-price {
      font-family: 'Syne', sans-serif;
      font-size: 24px;
      font-weight: 800;
      color: var(--accent-primary);
    }

    .contact-btn {
      padding: 10px 18px;
      background: linear-gradient(135deg, var(--accent-primary), #00cc6f);
      border: none;
      border-radius: 10px;
      color: var(--bg-primary);
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .contact-btn:hover {
      transform: scale(1.04);
      box-shadow: 0 8px 16px rgba(0,255,136,0.25);
    }

    .loading, .error, .empty-state {
      text-align: center;
      padding: 80px 20px;
    }

    .loading-spinner {
      width: 56px;
      height: 56px;
      border: 4px solid var(--border);
      border-top-color: var(--accent-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 18px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
      text-align: center;
      padding: 35px 20px;
      border-top: 2px solid var(--border);
      color: var(--text-muted);
      font-size: 12px;
    }

    @media (max-width: 768px) {
      .products-grid { grid-template-columns: 1fr; }
      .header-actions { width: 100%; justify-content: space-between; }
      .controls { flex-direction: column; }
    }
  </style>
</head>
<body data-theme="dark">
  <div class="background-grid"></div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [products, setProducts] = useState([]);
      const [filteredProducts, setFilteredProducts] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [searchTerm, setSearchTerm] = useState('');
      const [categoryFilter, setCategoryFilter] = useState('todos');
      const [theme, setTheme] = useState(localStorage.getItem('theme') || 'dark');

      useEffect(() => {
        document.body.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
      }, [theme]);

      useEffect(() => {
        fetchProducts();
        const interval = setInterval(fetchProducts, 300000); // 5 minutos
        return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        filterProducts();
      }, [products, searchTerm, categoryFilter]);

      const fetchProducts = async () => {
        try {
          setLoading(true);

          const workerUrl = "https://shiny-block-6bdf.contato-714.workers.dev/";
          const response = await fetch(workerUrl);

          if (!response.ok) throw new Error("Erro ao buscar dados da planilha.");

          const data = await response.json();
          const rows = data.values || [];

          const productsData = rows
            .filter(row => row[0])
            .map((row, index) => ({
              id: index,
              nome: row[0] || '',
              categoria: row[1] || '',
              preco: row[2] || '',
              estado: row[3] || '',
              descricao: row[4] || '',
              especificacoes: row[5] || '',
              contato: row[6] || '',
              emoji: row[7] || '💻',
              imageUrl: row[8] || ''
            }));

          setProducts(productsData);
          setError(null);
        } catch (err) {
          setError(err.message || "Erro ao carregar produtos.");
        } finally {
          setLoading(false);
        }
      };

      const filterProducts = () => {
        let filtered = products;

        if (categoryFilter !== 'todos') {
          filtered = filtered.filter(p => p.categoria.toLowerCase() === categoryFilter.toLowerCase());
        }

        if (searchTerm) {
          filtered = filtered.filter(p =>
            p.nome.toLowerCase().includes(searchTerm.toLowerCase()) ||
            p.descricao.toLowerCase().includes(searchTerm.toLowerCase())
          );
        }

        setFilteredProducts(filtered);
      };

      const toggleTheme = () => setTheme(theme === 'dark' ? 'light' : 'dark');

      const categories = ['todos', ...new Set(products.map(p => p.categoria).filter(Boolean))];

      if (loading) {
        return (
          <div className="container">
            <div className="loading">
              <div className="loading-spinner"></div>
              <p>Carregando produtos...</p>
            </div>
          </div>
        );
      }

      if (error) {
        return (
          <div className="container">
            <div className="error">
              <h2>❌ Erro ao carregar</h2>
              <p>{error}</p>
            </div>
          </div>
        );
      }

      return (
        <div className="container">
          <header>
            <div className="header-content">
              <div className="logo">TechUsados</div>
              <div className="header-actions">
                <button className="theme-toggle" onClick={toggleTheme}>
                  {theme === 'dark' ? '☀️ Claro' : '🌙 Escuro'}
                </button>
                <div className="status-indicator">
                  <div className="status-dot"></div>
                  <span>{products.length} produtos</span>
                </div>
              </div>
            </div>
          </header>

          <div className="controls">
            <div className="search-box">
              <input
                type="text"
                placeholder="🔍 Buscar produtos..."
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
              />
            </div>
            <div className="filter-group">
              {categories.map(cat => (
                <button
                  key={cat}
                  className={`filter-btn ${categoryFilter === cat ? 'active' : ''}`}
                  onClick={() => setCategoryFilter(cat)}
                >
                  {cat}
                </button>
              ))}
            </div>
          </div>

          {filteredProducts.length === 0 ? (
            <div className="empty-state">
              <h2>🔍 Nenhum produto encontrado</h2>
              <p style={{color: 'var(--text-muted)'}}>Tente ajustar filtros ou busca</p>
            </div>
          ) : (
            <div className="products-grid">
              {filteredProducts.map((product, index) => (
                <div
                  key={product.id}
                  className="product-card"
                  style={{animationDelay: `${index * 0.08}s`}}
                >
                  {product.estado && (
                    <div className="product-badge">{product.estado}</div>
                  )}
                  <div className="product-image">
                    {product.imageUrl ? (
                      <img
                        src={product.imageUrl}
                        alt={product.nome}
                        onError={(e) => {
                          e.target.style.display = 'none';
                          e.target.parentElement.innerHTML += `<div class="emoji-fallback">${product.emoji}</div>`;
                        }}
                      />
                    ) : (
                      <div className="emoji-fallback">{product.emoji}</div>
                    )}
                  </div>
                  <div className="product-content">
                    <div className="product-category">{product.categoria}</div>
                    <h3 className="product-name">{product.nome}</h3>
                    <p className="product-description">{product.descricao}</p>

                    {product.especificacoes && (
                      <div className="product-specs">
                        {product.especificacoes.split(',').map((spec, i) => (
                          <span key={i} className="spec-tag">{spec.trim()}</span>
                        ))}
                      </div>
                    )}

                    <div className="product-footer">
                      <div className="product-price">R$ {product.preco}</div>
                      <button
                        className="contact-btn"
                        onClick={() => window.open(`https://wa.me/${product.contato}`, '_blank')}
                      >
                        Contato
                      </button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}

          <footer>
            <p>TechUsados © 2026 — Atualização automática a cada 5s</p>
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
