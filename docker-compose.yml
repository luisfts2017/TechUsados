version: "3.9"

services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./sessao_whatsapp:/app/sessao_whatsapp
    ports:
      - "${HEALTH_PORT:-3001}:3001"
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379
      - LOG_FORMAT=json
      - LOG_LEVEL=info

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  redis_data:
